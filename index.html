<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1428" />
    <title>Star Race — the swing</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8eeff;
        --soft: #93a4c8;
        --deep: #0b1428;
        --panel: #121d38;
        --rule: #27365c;
        --gold: #ffd166;
        --warn: #ff7a6b;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--deep);
        color: var(--ink);
        font:
          14px/1.4 'Segoe UI',
          system-ui,
          sans-serif;
        overflow: hidden;
        touch-action: manipulation;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #game {
        flex: 1 1 auto;
        display: block;
        width: 100%;
        min-height: 0;
      }
      #panel {
        flex: 0 0 auto;
        padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
        background: var(--panel);
        border-top: 1px solid var(--rule);
      }
      /* The two screens. The tab row is the one thing both share. */
      .screens {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-bottom: 8px;
      }
      .screen {
        padding: 7px 4px;
        border: 1px solid var(--rule);
        border-radius: 7px;
        background: #0e1730;
        color: var(--soft);
        font: 600 12px inherit;
        letter-spacing: 0.04em;
        cursor: pointer;
      }
      .screen.on {
        border-color: var(--gold);
        background: #1b2a4d;
        color: var(--gold);
      }
      /* The garage is a whole screen, not a drawer under the race. */
      #app:has(.panel[data-screen='garage']) #game {
        display: none;
      }
      #app:has(.panel[data-screen='garage']) #panel {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        border-top: 0;
      }
      #app:has(.panel[data-screen='garage']) .board {
        max-height: none;
        overflow-y: visible;
      }
      /* Why nothing you do here touches the lap on screen. */
      .staged {
        margin: 8px 0 0;
        padding: 6px 8px;
        border-left: 2px solid var(--gold);
        border-radius: 0 5px 5px 0;
        background: #0e1730;
        font-size: 10.5px;
        line-height: 1.35;
        color: var(--soft);
      }
      .bar {
        display: grid;
        gap: 3px;
        margin-bottom: 6px;
      }
      .lane {
        display: grid;
        grid-template-columns: 10px 72px 1fr 52px;
        align-items: center;
        gap: 7px;
        padding: 3px 5px;
        border-radius: 5px;
        font-size: 11.5px;
        color: var(--soft);
      }
      .lane.me {
        background: #0e1730;
        color: var(--ink);
        font-weight: 600;
      }
      .pip {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .who {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .track-bar {
        height: 6px;
        border-radius: 3px;
        background: #0a1226;
        border: 1px solid var(--rule);
        overflow: hidden;
      }
      .track-bar i {
        display: block;
        height: 100%;
        border-radius: 3px;
      }
      .gap {
        text-align: right;
        font:
          600 11px ui-monospace,
          Consolas,
          monospace;
        font-variant-numeric: tabular-nums;
      }
      .state {
        text-align: center;
        font-size: 11.5px;
        color: var(--soft);
        padding: 3px 0 7px;
        letter-spacing: 0.04em;
      }
      .state.wide {
        color: var(--warn);
        font-weight: 700;
      }
      .state.pit {
        color: var(--gold);
        font-weight: 700;
      }
      .state.done {
        color: var(--ink);
        font-weight: 700;
        font-size: 13px;
      }
      .tracks {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-bottom: 7px;
      }
      .track {
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: 6px 4px;
        border: 1px solid var(--rule);
        border-radius: 7px;
        background: #0e1730;
        color: var(--soft);
        font: inherit;
        cursor: pointer;
      }
      .track b {
        font-size: 12px;
        color: var(--ink);
      }
      .track span {
        font-size: 9.5px;
        line-height: 1.2;
      }
      .track.on {
        border-color: var(--gold);
        background: #1b2a4d;
      }
      .track.on b {
        color: var(--gold);
      }
      .plans {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .plan {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 9px 4px;
        min-height: 52px;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: #0e1730;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }
      .plan b {
        font-size: 15px;
      }
      .plan span {
        font-size: 10px;
        color: var(--soft);
        line-height: 1.25;
      }
      .plan.on {
        border-color: var(--gold);
        background: #1b2a4d;
      }
      .plan.on b {
        color: var(--gold);
      }
      .board {
        margin-top: 8px;
        max-height: 38vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .board h4 {
        margin: 8px 0 4px;
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--gold);
        opacity: 0.8;
      }
      .board h3 {
        margin: 10px 0 5px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--soft);
      }
      .totals {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        font-size: 11.5px;
        color: var(--soft);
        padding: 6px 7px;
        background: #0e1730;
        border-radius: 6px;
      }
      .totals b {
        color: var(--gold);
        font:
          700 13px ui-monospace,
          monospace;
      }
      .part {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        padding: 5px 7px;
        border: 1px solid var(--rule);
        border-radius: 6px;
        margin-bottom: 4px;
        font-size: 12px;
      }
      .part .t {
        display: flex;
        flex-direction: column;
        min-width: 0;
        color: var(--ink);
        line-height: 1.25;
      }
      .part .t em {
        font-style: normal;
        font-size: 9.5px;
        color: var(--soft);
      }
      .part .t b {
        color: var(--gold);
        font:
          700 11px ui-monospace,
          monospace;
      }
      .part .actions {
        display: flex;
        gap: 5px;
        flex: 0 0 auto;
      }
      .part button {
        padding: 5px 8px;
        border-radius: 5px;
        border: 1px solid var(--rule);
        background: #0e1730;
        color: var(--ink);
        font: 600 11px inherit;
        cursor: pointer;
      }
      .part button[disabled] {
        opacity: 0.35;
        cursor: default;
      }
      .board .empty,
      .waiting {
        font-size: 10.5px;
        color: var(--soft);
        line-height: 1.35;
        margin: 4px 0 0;
      }
      .waiting b {
        color: var(--ink);
        font-weight: 600;
      }
      .seedrow label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        color: var(--soft);
      }
      .seedrow {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
        /* The garage scrolls, so the way out of it has to come with you. */
        position: sticky;
        bottom: calc(-8px - env(safe-area-inset-bottom));
        padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
        background: var(--panel);
        box-shadow: 0 -8px 12px -6px var(--panel);
      }
      .seedrow label {
        flex: 1 1 auto;
      }
      .seedrow input {
        flex: 1 1 auto;
        min-width: 0;
        background: #0e1730;
        border: 1px solid var(--rule);
        border-radius: 6px;
        color: var(--ink);
        padding: 5px 7px;
        font: inherit;
      }
      .seedrow button.go {
        background: var(--gold);
        border-color: var(--gold);
        color: #10203d;
        font-weight: 700;
      }
      .seedrow button {
        white-space: nowrap;
        padding: 7px 12px;
        border-radius: 6px;
        border: 1px solid var(--rule);
        background: #0e1730;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="Star Race"></canvas>
      <div id="panel"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
