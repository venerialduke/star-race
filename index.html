<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1428" />
    <title>Star Race — the swing</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8eeff;
        --soft: #93a4c8;
        --deep: #0b1428;
        --panel: #121d38;
        --rule: #27365c;
        --gold: #ffd166;
        --warn: #ff7a6b;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--deep);
        color: var(--ink);
        font:
          14px/1.4 'Segoe UI',
          system-ui,
          sans-serif;
        overflow: hidden;
        touch-action: manipulation;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #game {
        flex: 1 1 auto;
        display: block;
        width: 100%;
        min-height: 0;
      }
      #panel {
        flex: 0 0 auto;
        padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
        background: var(--panel);
        border-top: 1px solid var(--rule);
      }
      .readouts {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        margin-bottom: 6px;
      }
      .r {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .r b {
        font:
          700 17px/1.1 ui-monospace,
          Consolas,
          monospace;
        font-variant-numeric: tabular-nums;
      }
      .r span {
        font-size: 10.5px;
        color: var(--soft);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .state {
        text-align: center;
        font-size: 11.5px;
        color: var(--soft);
        padding: 3px 0 7px;
        letter-spacing: 0.04em;
      }
      .state.wide {
        color: var(--warn);
        font-weight: 700;
      }
      .tracks {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-bottom: 7px;
      }
      .track {
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: 6px 4px;
        border: 1px solid var(--rule);
        border-radius: 7px;
        background: #0e1730;
        color: var(--soft);
        font: inherit;
        cursor: pointer;
      }
      .track b {
        font-size: 12px;
        color: var(--ink);
      }
      .track span {
        font-size: 9.5px;
        line-height: 1.2;
      }
      .track.on {
        border-color: var(--gold);
        background: #1b2a4d;
      }
      .track.on b {
        color: var(--gold);
      }
      .plans {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .plan {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 9px 4px;
        min-height: 52px;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: #0e1730;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }
      .plan b {
        font-size: 15px;
      }
      .plan span {
        font-size: 10px;
        color: var(--soft);
        line-height: 1.25;
      }
      .plan.on {
        border-color: var(--gold);
        background: #1b2a4d;
      }
      .plan.on b {
        color: var(--gold);
      }
      .sliders {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 8px;
      }
      .sliders label,
      .seedrow label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        color: var(--soft);
      }
      .sliders input {
        flex: 1 1 auto;
        min-width: 0;
        accent-color: var(--gold);
      }
      .sliders output {
        font:
          700 11.5px ui-monospace,
          monospace;
        color: var(--ink);
        min-width: 30px;
        text-align: right;
      }
      .seedrow {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
      }
      .seedrow label {
        flex: 1 1 auto;
      }
      .seedrow input {
        flex: 1 1 auto;
        min-width: 0;
        background: #0e1730;
        border: 1px solid var(--rule);
        border-radius: 6px;
        color: var(--ink);
        padding: 5px 7px;
        font: inherit;
      }
      .seedrow button {
        padding: 7px 12px;
        border-radius: 6px;
        border: 1px solid var(--rule);
        background: #0e1730;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="Star Race"></canvas>
      <div id="panel"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
