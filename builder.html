<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Star Race — track builder</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a30;
        --ink: #e8eeff;
        --soft: #9fb0d0;
        --gold: #ffd166;
        --line: rgba(232, 238, 255, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.45 'Segoe UI',
          system-ui,
          sans-serif;
        display: grid;
        grid-template-columns: 1fr 380px;
        height: 100vh;
      }
      @media (max-width: 860px) {
        body {
          grid-template-columns: 1fr;
          grid-template-rows: 46vh 1fr;
        }
      }
      #board {
        width: 100%;
        height: 100%;
        display: block;
      }
      #panel {
        background: var(--panel);
        border-left: 1px solid var(--line);
        overflow-y: auto;
        padding: 12px 14px 40px;
      }
      h3 {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--soft);
        margin: 18px 0 6px;
      }
      button {
        background: #1b2645;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 9px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover {
        background: #24325a;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.wide {
        width: 100%;
        margin-top: 6px;
      }
      .bar {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        align-items: center;
      }
      .bar input {
        flex: 1 1 130px;
        background: #0d1428;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 8px;
        font: inherit;
      }
      .state {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 12.5px;
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
      }
      .state.good {
        background: rgba(110, 231, 168, 0.12);
        color: #8ff0bd;
      }
      .state.open {
        background: rgba(255, 95, 122, 0.12);
        color: #ff9fb0;
      }
      .shelf {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .rows {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .row {
        display: grid;
        grid-template-columns: 22px 1fr auto;
        gap: 8px;
        align-items: center;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 7px;
        cursor: pointer;
      }
      .row.on {
        border-color: #7ee0ff;
        background: rgba(126, 224, 255, 0.08);
      }
      .row.bad {
        border-color: #ff5f7a;
      }
      .row .n {
        color: var(--soft);
        font-variant-numeric: tabular-nums;
      }
      .row .acts {
        display: flex;
        gap: 4px;
      }
      .hint {
        color: var(--soft);
        font-size: 11px;
        margin: 6px 0 0;
      }
      .hint em {
        font-style: normal;
        color: var(--gold);
      }
      .props {
        border-top: 1px dashed var(--line);
        margin-top: 6px;
        padding-top: 3px;
      }
      .props .says {
        color: var(--gold);
        font-size: 11px;
        margin: 4px 0 0;
        text-align: right;
      }
      select {
        width: 100%;
        background: #0d1428;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 5px;
        font: inherit;
        font-size: 11px;
        padding: 2px 4px;
      }
      .row .t {
        display: flex;
        flex-direction: column;
        font-size: 13px;
      }
      .row em {
        color: var(--soft);
        font-style: normal;
        font-size: 11px;
      }
      .pieces {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 6px;
      }
      .piece {
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 6px 8px;
      }
      .phead {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 13px;
      }
      .phead span {
        flex: 1;
      }
      .piece label,
      .props label {
        display: grid;
        grid-template-columns: 56px 1fr 38px;
        gap: 6px;
        align-items: center;
        font-size: 11px;
        color: var(--soft);
        margin-top: 4px;
      }
      .piece b,
      .props b {
        color: var(--gold);
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      input[type='range'] {
        width: 100%;
        accent-color: #7ee0ff;
      }
      .empty {
        color: var(--soft);
        font-size: 12px;
        margin: 4px 0;
      }
      textarea {
        width: 100%;
        background: #0d1428;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 7px;
        font:
          11px/1.5 ui-monospace,
          Consolas,
          monospace;
        padding: 8px;
        resize: vertical;
      }
    </style>
  </head>
  <body>
    <canvas id="board"></canvas>
    <div id="panel"></div>
    <script type="module" src="/src/builder/main.ts"></script>
  </body>
</html>
